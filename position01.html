<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>position 속성</title>
    <style>
      .box {
        /* static: 기본 상태 */
        position: static;
        top: 50px;
        width: 100px;
        height: 100px;
        background-color: red;
      }
      .box1 {
        /* relative: 현재 자기 위치를 기준으로 이동 */
        position: relative;
        top: 50px;
        left: 50px;
        width: 150px;
        height: 150px;
        background-color: aqua;
      }
      .area {
        /* relative: 부모요소로써 기준점을 준다 */
        position: relative;
        width: 200px;
        height: 200px;
        background-color: yellow;
      }
      .box2 {
        /* absolute: 부모요소를 기준으로 원하는 위치에 배치 */
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50px;
        height: 50px;
        background-color: blue;
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
    <div class="box1"></div>
    <div class="area">
      <div class="box2"></div>
    </div>
  </body>
</html>
